version: "3.8"

services:
  primary:
    image: postgres:18.3
    container_name: primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "55432:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  read-replica-1:
    image: postgres:18.3
    container_name: replica1
    depends_on:
      primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPASSWORD: rep_pass
    ports:
      - "55434:5432"
    volumes:
      - replica1_data:/var/lib/postgresql
      - ./replica-init/init-replica-1.sql:/docker-entrypoint-initdb.d/init-replica.sql

  read-replica-2:
    image: postgres:18.3
    container_name: replica2
    depends_on:
      primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPASSWORD: rep_pass
    ports:
      - "55435:5432"
    volumes:
      - replica2_data:/var/lib/postgresql
      - ./replica-init/init-replica-2.sql:/docker-entrypoint-initdb.d/init-replica.sql

volumes:
  primary_data:
  replica1_data:
  replica2_data:
