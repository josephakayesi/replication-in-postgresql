services:
  streaming-primary:
    image: postgres:18.3
    container_name: streaming-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "55452:5432"
    volumes:
      - streaming_primary_data:/var/lib/postgresql
      - ./init/streaming:/docker-entrypoint-initdb.d
      - ./configs/streaming/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./configs/streaming/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  streaming-replica-1:
    image: postgres:18.3
    container_name: streaming-replica-1
    depends_on:
      streaming-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPASSWORD: rep_pass
      PRIMARY_HOST: streaming-primary
    ports:
      - "55454:5432"
    volumes:
      - streaming_replica1_data:/var/lib/postgresql
      - ./replica-init/streaming/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["bash", "/replica-entrypoint.sh"]

  streaming-replica-2:
    image: postgres:18.3
    container_name: streaming-replica-2
    depends_on:
      streaming-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPASSWORD: rep_pass
      PRIMARY_HOST: streaming-primary
    ports:
      - "55455:5432"
    volumes:
      - streaming_replica2_data:/var/lib/postgresql
      - ./replica-init/streaming/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["bash", "/replica-entrypoint.sh"]

volumes:
  streaming_primary_data:
  streaming_replica1_data:
  streaming_replica2_data:
